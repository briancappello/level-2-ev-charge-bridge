# Copy to secrets.yaml (not committed) and fill in.
wifi_ssid: "your-network"
wifi_password: "your-wifi-password"
ap_password: "fallback-hotspot-password"
ota_password: "ota-password"
# The EVerest PC's address on the network M1 joins. Its mosquitto must listen
# on that interface (see step 8 of the assembly).
mqtt_broker: "192.168.1.10"
mqtt_username: "m1"
mqtt_password: "mqtt-password"
# Any reachable NTP server; the PC itself if it runs chrony or ntpd as a server.
sntp_server: "pool.ntp.org"
