# Publish cb-l2-evse.html to GitHub Pages as the site's index page.
name: Pages

on:
  push:
    branches: [master]
    paths: [cb-l2-evse.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble site
        run: |
          mkdir -p _site
          cp cb-l2-evse.html _site/index.html
          cp cb-l2-evse.html _site/cb-l2-evse.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
